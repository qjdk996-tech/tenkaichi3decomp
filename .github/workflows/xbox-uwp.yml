name: Build Xbox UWP (No ISO)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً

jobs:
  build-uwp:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # لضمان جلب كافة المكتبات الفرعية إذا وجدت

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.x'

    # (اختياري) تشغيل أية سكربتات لتوليد ملفات المشروع إن لم تكن مرفوعة، مثل CMake أو أداة بناء خاصة بالمشروع
    # - name: Configure Project
    #   run: python configure.py --uwp

    - name: Build UWP Appx Package
      run: |
        msbuild port/uwp/Tenkaichi3Decomp.sln /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Always /p:AppxBundlePlatforms="x64"
      # ملاحظة: تأكد من تعديل مسار ملف الـ .sln (Solution) الخاص بـ UWP وفقاً للمجلد الموجود في مشروعك (مثلاً داخل مجلد port أو xbox)

    - name: Upload UWP Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Tenkaichi3Decomp-Xbox-UWP
        path: |
          **/*.appx
          **/*.appxbundle
          **/*.msixbundle
